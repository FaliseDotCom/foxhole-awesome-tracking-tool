# Weekly version updates, all arriving on the same day.
version: 2
updates:
  - package-ecosystem: npm
    directory: /.app
    schedule:
      interval: weekly
      day: monday
    groups:
      development:
        dependency-type: development

  - package-ecosystem: composer
    directory: /.api
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: [ '*' ]
