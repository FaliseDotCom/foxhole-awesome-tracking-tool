<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, user-scalable=no" />
    <link rel="icon" type="image/x-icon" href="/favicon.png">
    <style>
      .filter
      {
        -webkit-filter: sepia(100%) saturate(300%) hue-rotate(680deg) brightness( 90% ) contrast( 150% );
      }
    </style>
	</head>
	<body>
		<svg width="200px" height="200px"  xmlns="http://www.w3.org/2000/svg" >

      <filter class="filter" id="filter"/>

      <symbol id="image" width="30" height="30" viewBox="0 0 30 30"  class="filter" filter="url(#filter);">
        <rect width="100%" height="100%" fill="red"/>
        <image x="0" y="0" width="30px" height="30px" href="https://fatt.fali.se/assets/icons/coalfield.png" class="filter" filter="url(#filter);"/>
      </symbol>


      <use href="#image" x="5" y="5" width="50px" height="50px"  class="filter"  filter="url(#filter);" fill="red"/>

    </svg>
  </body>
</html>
